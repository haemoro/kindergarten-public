spring:
  profiles:
    active: local

  application:
    name: kindergarten

  datasource:
    hikari:
      maximum-pool-size: 7
      minimum-idle: 2
      keepalive-time: 30000
      connection-timeout: 20000
      validation-timeout: 5000
      max-lifetime: 600000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  sql:
    init:
      mode: always

server:
  port: 1025

logging:
  level:
    root: INFO
    com.sotti.kindergarten: DEBUG

jwt:
  secret: kindergarten-jwt-secret-key-must-be-at-least-256-bits-long-for-hs256
  expiration-ms: 86400000