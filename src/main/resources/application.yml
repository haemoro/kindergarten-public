spring:
  profiles:
    active: local

  application:
    name: kindergarten

  datasource:
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      keepalive-time: 30000
      connection-timeout: 20000
      validation-timeout: 5000
      max-lifetime: 580000
      leak-detection-threshold: 30000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_batch_fetch_size: 50
        query:
          plan_cache_max_size: 256
          in_clause_parameter_padding: true
  sql:
    init:
      mode: always

server:
  port: 1025

logging:
  level:
    root: INFO
    com.sotti.kindergarten: DEBUG

jwt:
  secret: kindergarten-jwt-secret-key-must-be-at-least-256-bits-long-for-hs256
  expiration-ms: 86400000