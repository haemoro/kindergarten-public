services:
  sotti-kindergarten:
    image: sotti-kindergarten:${IMAGE_TAG:-latest}
    container_name: sotti-kindergarten
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-1025}:1025"
    env_file:
      - .env
    environment:
      - SPRING_PROFILES_ACTIVE=production
      - TZ=Asia/Seoul
    deploy:
      resources:
        limits:
          memory: 384M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:1025/actuator/health"]
      interval: 30s
      timeout: 3s
      start_period: 40s
      retries: 3
